[tool.poetry]
name = "aumic"
version = "0.1.0"
description = "Autoencoder-based spectral modeling of AU Mic using high-res CARMENES VIS_A spectra."
authors = ["Marvin Ernst <me1020@gmx.de>"]
packages = [{ include = "aumic", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"

# Core scientific stack
numpy = "^1.24"
scipy = "^1.9"
pandas = "^1.5"
matplotlib = "^3.6"
seaborn = "^0.12"
scikit-learn = "^1.1"
astropy = "^5.2"
umap-learn = "^0.5.5"
imageio = "^2.31"

# Deep learning
torch = "^2.5"
torchvision = "^0.20"
torchaudio = "^2.5"

# TensorFlow 2.15.0 installed manually via pip due to Poetry resolver conflict

# Jupyter and notebook support
ipykernel = "^6.29"
jupyter-core = "^5.7"
matplotlib-inline = "^0.1.7"
traitlets = "^5.14"
pexpect = "^4.9"
ptyprocess = "^0.7"
prompt-toolkit = "^3.0"
pyzmq = "^26.4"
jedi = "^0.19"
tornado = "^6.4"

# Utilities
pygments = "^2.19"
stack-data = "^0.6"
sympy = "^1.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
